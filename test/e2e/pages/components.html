<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>faust-web-component tests</title>
</head>
<body>
    <!-- Every component has an input attribute: without it, the first audio device
         is selected, which asks for the microphone. -->

    <faust-widget id="widget" input="impulse">
        <!--
import("stdfaust.lib");
cutoff = hslider("cutoff",1000,50,10000,1) : si.smoo;
process = fi.lowpass(2, cutoff), fi.highpass(2, cutoff);
-->
    </faust-widget>

    <faust-editor id="plain" input="impulse">
        <!--
smooth = *(0.5) : + ~ *(0.5);
gate   = button("gate");
process = _ <: smooth, (*(gate) : smooth);
-->
    </faust-editor>

    <faust-editor id="step" input="impulse" svg-step="16" svg-step-input="1" svg-step-controls="gate=1@3 gate=0@8" svg-fold="0">
        <!--
smooth = *(0.5) : + ~ *(0.5);
gate   = button("gate");
process = _ <: smooth, (*(gate) : smooth);
-->
    </faust-editor>

    <faust-editor id="offset" input="impulse" svg-step="4" svg-step-offset="10" svg-step-input="1 - 1'">
        <!--
process = + ~ *(0.5);
-->
    </faust-editor>

    <faust-editor id="fold" input="impulse" svg-fold="0">
        <!--
smooth = *(0.5) : + ~ *(0.5);
gate   = button("gate");
process = _ <: smooth, (*(gate) : smooth);
-->
    </faust-editor>

    <faust-editor id="ignored" input="impulse" svg-step-input="1">
        <!--
process = *(0.5);
-->
    </faust-editor>

    <faust-editor id="bad-label" input="impulse" svg-step="8" svg-step-controls="nope=1">
        <!--
process = _ * button("gate");
-->
    </faust-editor>

    <faust-editor id="bad-fold" input="impulse" svg-fold="x">
        <!--
process = *(0.5);
-->
    </faust-editor>

    <script src="faust-web-component.js"></script>
</body>
</html>
