<!DOCTYPE html>
<html lang="en">

<body>
    <center>
        <H1>Here's an embedded editor!</H1>
    </center>

    <faust-editor>
        <!--
declare name "Vocal FOF MIDI";
declare description "MIDI-controllable FOF vocal synthesizer.";
declare license "MIT";
declare copyright "(c)Mike Olsen, CCRMA (Stanford University)";

import("stdfaust.lib");
declare options "[midi:on][nvoices:12]";

process = pm.SFFormantModelFofSmooth_ui_MIDI <: _,_;
-->
    </faust-editor>
    <center>
        <H1>Here's an effect, fed by a test signal!</H1>
    </center>

    <faust-editor input="impulse">
        <!--
import("stdfaust.lib");
process = fi.resonlp(hslider("freq",1000,100,5000,1), 10, 1) <: _,_;
-->
    </faust-editor>
    <center>
        <H1>Here's a simple DSP widget!</H1>

        <faust-widget>
            <!--
import("stdfaust.lib");
ctFreq = hslider("[0]cutoffFrequency",500,50,10000,0.01) : si.smoo;
q = hslider("[1]q",5,1,30,0.1) : si.smoo;
gain = hslider("[2]gain",1,0,1,0.01) : si.smoo;
t = button("[3]gate") : si.smoo;
process = no.noise : fi.resonlp(ctFreq,q,gain)*t <: dm.zita_light;
-->
        </faust-widget>

        <H1>Here's a stereo effect widget, fed by a test signal!</H1>

        <faust-widget input="white noise">
            <!--
import("stdfaust.lib");
cutoff = hslider("cutoff",1000,50,10000,1) : si.smoo;
process = fi.lowpass(2, cutoff), fi.highpass(2, cutoff);
-->
        </faust-widget>
    </center>
    <script src="faust-web-component.js"></script>

</body>

</html>
